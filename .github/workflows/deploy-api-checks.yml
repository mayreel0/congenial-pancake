name: API deployment checks

on:
  pull_request:
    paths:
      - ".github/workflows/deploy-api*.yml"
      - ".github/scripts/check-api-health*"
      - "infra/terraform/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: hashicorp/setup-terraform@v3
      - run: node --test .github/scripts/check-api-health.test.mjs
      - run: bash -n .github/scripts/check-api-health.sh
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate
