name: Verify

# Runs the same lint/typecheck/test/build gate every round in this repo
# has always been expected to pass locally before opening a PR — until
# now nothing actually enforced it server-side (pr-title.yml only checks
# the title string), so a PR could merge without any of it having
# actually been run. Targets v1 specifically, not main — see
# docs/decisions and this repo's own PR history, every PR here bases off
# v1.
on:
  pull_request:
    branches: [v1]
  # Backstop: pull_request's default event types don't include a PR's base
  # branch being retargeted (e.g. after a stacked dependency PR merges), so
  # a PR whose base changes to v1 late can merge without this ever
  # re-running against the final diff — this actually happened for PR #183.
  # Triggering on every push to v1 catches that case regardless of what
  # happened at PR time.
  push:
    branches: [v1]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run verify

      - run: pnpm run knip
