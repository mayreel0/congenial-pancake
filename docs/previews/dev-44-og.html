<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>온설 OG 이미지 미리보기 · DEV-44</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0 auto;
        max-width: 1264px;
        padding: 32px;
        background: #faf7f2;
        color: #2b2620;
        font-family: system-ui, sans-serif;
        line-height: 1.6;
      }
      h1 { font-size: 24px; }
      h2 { margin-top: 32px; font-size: 18px; }
      p { max-width: 760px; }
      .preview { display: block; width: 100%; height: auto; }
      .small { width: min(100%, 360px); }
      .note { color: #7a7166; font-size: 14px; }
      @media (max-width: 600px) { body { padding: 16px; } }
    </style>
  </head>
  <body>
    <h1>온설 OG 이미지 미리보기</h1>
    <p>
      기존 말풍선 아이콘을 크게 보여주고, 서비스 이름과 현재 소개 문구를
      함께 배치했습니다. 아이콘의 어두운 배경에 맞춰 따뜻한 색의 그림이
      눈에 들어오도록 구성했습니다. 아이콘 모서리를 모바일 앱 아이콘처럼 둥글게 처리했습니다.
    </p>
    <p class="note">
      실제 공유에 사용하는 1200 × 630 PNG입니다.
    </p>
    <img class="preview" src="../../apps/web/public/og-image.png" width="1200" height="630"
      alt="웃는 두 말풍선과 온설 — 짧은 위로 요청과 담백한 답장을 주고받는 서비스" />
    <h2>작은 공유 카드 크기</h2>
    <img class="preview small" src="../../apps/web/public/og-image.png" width="1200" height="630"
      alt="온설 공유 이미지를 너비 360픽셀로 축소한 미리보기" />
    <p class="note">
      원본 자산: apps/web/public/icon-512.png. 새 일러스트나 문구를 추가하지 않았습니다.
      Open Graph와 Twitter 공유 메타데이터가 이 PNG를 함께 사용합니다.
    </p>
  </body>
</html>
